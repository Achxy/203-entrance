name: Firmware and console
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install host build prerequisites
        run: sudo apt-get update && sudo apt-get install -y git cmake ninja-build python3.12 python3.12-venv libusb-1.0-0 build-essential zlib1g-dev
      - name: Install pinned SDK and create disposable signing key
        run: python3.12 tools/entrance.py setup
      - name: Build signed test firmware and enforce slot size
        run: ./entrance build --version 0.1.0-ci.${{ github.run_number }}
      - name: Exercise production parsers and OTA state machine
        run: ./entrance test
      - name: Validate recovery/security configuration
        run: ./entrance audit
      - name: Build the separate USB-to-Wi-Fi maintenance hub
        run: ./hubctl build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disposable-key-test-firmware
          path: |
            build/203-entrance.bin
            build/203-entrance.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            .local/build-provenance.json
          include-hidden-files: true
          retention-days: 7
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-evidence
          path: .local/browser/
          include-hidden-files: true
          retention-days: 7
  arcade-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/arcade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: sites/arcade/package-lock.json
      - run: npm run install:ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
  arcade-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run
